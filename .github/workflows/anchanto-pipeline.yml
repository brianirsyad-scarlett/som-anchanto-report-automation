name: Anchanto Report Pipeline

on:
  workflow_dispatch: {}
  # On time: Power Automate 'GitHub timer' -> dispatch.yml. Cron = backup only.
  schedule:
    # Every 6 hours: 05:xx, 11:xx, 17:xx, 23:xx UTC = 12, 18, 00, 06 WIB. Each slot is tried twice
    # (:17 and :47) at off-peak minutes - GitHub delays or drops scheduled runs at :00 and :30. The
    # second try ends in seconds if the first already rebuilt (see the "Skip if" step below).
    - cron: "17,47 5,11,17,23 * * *"

permissions:
  contents: read
  actions: read
  issues: write   # failure mail = a MAIL| issue; Power Automate mails it

concurrency:
  group: anchanto-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          cat <<EOF > .env
          ANCHANTO_EMAIL=${{ secrets.ANCHANTO_EMAIL }}
          ANCHANTO_PASSWORD=${{ secrets.ANCHANTO_PASSWORD }}
          EOF

      - name: Write GCS credentials from secret
        run: |
          cat <<'EOF' > gcp_key.json
          ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Skip if a run already finished in the last 5 hours (late GitHub schedule)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
        run: |
          # Power Automate starts this pipeline on time; GitHub's own cron usually
          # arrives hours later. If the output was rebuilt in the last 5 hours, stop -
          # a second build would only re-trigger the downstream Sell In chain.
          python - <<'EOF'
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          from google.cloud import storage
          wib = ZoneInfo("Asia/Jakarta")
          b = storage.Client().bucket("bucket_som").get_blob("sales_parquet/raw/primary/anchanto/Anchanto.parquet")
          done = b is not None and (dt.datetime.now(dt.timezone.utc) - b.updated) < dt.timedelta(hours=5)
          print(f"output already built in the last 5 hours: {done}" + (f" ({b.updated.astimezone(wib):%H:%M} WIB)" if b else ""))
          print("skip=true" if done else "skip=false", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          EOF

      # Searches the home list AND the Deleted tab: each new report generated on Anchanto moves the
      # previous one to Deleted, but its download link keeps working, so the newest finished report
      # is always found. Sets stale=true (without failing) when report generation has stalled.
      - name: Download completed reports from Anchanto to GCS
        id: download
        if: steps.guard.outputs.skip != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
        run: python download_anchanto_reports.py

      - name: Mail if Anchanto report generation has stalled (once, while the issue is open)
        if: steps.download.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.download.outputs.stale_reason }}
        run: |
          title="MAIL|Anchanto reports are stale"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "warning issue already open - not mailing again"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --assignee brianirsyad-scarlett \
              --title "$title" \
              --body "$REASON. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Close this issue once reports are fresh again."
          fi

      - name: Process GCS raw CSVs into Excel, CSV, and Parquet
        if: steps.guard.outputs.skip != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
        run: python BigQuery_Anchanto.py

      - name: Mail on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee brianirsyad-scarlett             --title "MAIL|Anchanto pipeline failed"             --body "A step failed - see the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
